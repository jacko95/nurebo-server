AWSTemplateFormatVersion: 2010-09-09

# Description: Crea un bucket S3

Parameters:
  # MyKeyPair:
  #   Type: String
  #   Description: Public key material for EC2 key pair

  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instance
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.

  # AcmCertificate:
  #   Description: The ARN of the AWS Certification Manager's Certificate 
  #   Type: String

  # InstanceType:
  #   Description: WebServer EC2 instance type
  #   Type: String
  #   Default: t2.micro
  #   AllowedValues:
  #     - t3.micro
  #     - t2.nano
  #     - t2.micro
  #   ConstraintDescription: must be a valid EC2 instance type.

  # RDS Parameters
  # DatabaseInstanceIdentifier:
  #   AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
  #   ConstraintDescription: Must begin with a letter and contain only alphanumeric characters
  #   Default: mysql57db
  #   Description: Instance identifier name
  #   MaxLength: 60
  #   MinLength: 1
  #   Type: String

  # DatabaseName:
  #   AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
  #   ConstraintDescription: Must begin with a letter and contain only alphanumeric characters
  #   Default: applicationdb
  #   Description: MySQL database name
  #   MaxLength: 64
  #   MinLength: 1
  #   Type: String

  # DatabaseUser:
  #   AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
  #   ConstraintDescription: Must begin with a letter and contain only alphanumeric characters
  #   Default: dbadmin
  #   Description: Username for MySQL database access
  #   MaxLength: 16
  #   MinLength: 1
  #   NoEcho: true
  #   Type: String

  # DatabasePassword:
  #   AllowedPattern: '[a-zA-Z0-9]*'
  #   ConstraintDescription: Must contain only alphanumeric characters
  #   Default: database1407
  #   Description: Password for MySQL database access
  #   MaxLength: 41
  #   MinLength: 8
  #   NoEcho: true
  #   Type: String

  # DatabaseBackupRetentionPeriod:
  #   ConstraintDescription: Database backup retention period must be between 0 and 35 days
  #   Default: 0
  #   Description: The number of days for which automatic DB snapshots are retained
  #   MaxValue: 35
  #   MinValue: 0
  #   Type: Number

  # DatabaseAllocatedStorage:
  #   ConstraintDescription: Must be between 5 and 1024Gb
  #   Default: 20
  #   Description: The size of the database (Gb)
  #   MaxValue: 65536
  #   MinValue: 5
  #   Type: Number

  # DatabaseInstanceClass:
  #   AllowedValues:
  #     - db.t1.micro
  #     - db.t2.micro
  #     - db.m1.small
  #     - db.m1.medium
  #     - db.m1.large
  #   ConstraintDescription: Must select a valid database instance type
  #   Default: db.t2.micro
  #   Description: The database instance type
  #   Type: String

  # MultiAZDatabase:
  #   AllowedValues:
  #     - true
  #     - false
  #   ConstraintDescription: Must be either true or false
  #   Default: false
  #   Description: Creates a Multi-AZ MySQL Amazon RDS database instance
  #   Type: String

# Metadata:
  
# Conditions:

Mappings:
  RegionMap:
    # Ubuntu 26.04 LTS server amd64 hvm gp3
    eu-central-1:
     AMI: ami-0303e2e4a29f041a3
    # us-east-1:
    #  AMI: ami-0557a15b87f6559cf
    eu-south-1:
     AMI: ami-0ba4fb1abfec5c5ce
    # us-west-2:
    #  "AMI": "ami-09cd747c78a9add63"
    # Amazon Linux (Red-Hat-based)
    # us-east-1:
    #  "AMI": "ami-0ed9277fb7eb570c9"
    # us-west-2:
    #  "AMI": "ami-00f7e5c52c0f43726"

Resources:
  VPC:
    Type: AWS::EC2::VPC
    # DependsOn:
    Properties:
      CidrBlock: 10.0.0.0/16 
      EnableDnsSupport: true
      EnableDnsHostnames: true
      # InstanceTenancy: String
      # Ipv4IpamPoolId: String
      # Ipv4NetmaskLength: Integer
      Tags:
        - Key: Name
          Value: Project

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    # DependsOn:
    Properties:
      Tags:
        - Key: Name
          Value: Project

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    # DependsOn:
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC
      # VpnGatewayId: String

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    # DependsOn:
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Project Public Subnet (AZ1)

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    # DependsOn:
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs  '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Project Public Subnet (AZ2)

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    # DependsOn:
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs  '']
      CidrBlock: 10.0.11.0/24
      MapPublicIpOnLaunch: false
      Tags: 
        - Key: Name
          Value: Project Private Subnet (AZ1)

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    # DependsOn:
    Properties: 
      # AssignIpv6AddressOnCreation: Boolean
      AvailabilityZone: !Select [1, !GetAZs  '']
      # AvailabilityZoneId: String
      CidrBlock: 10.0.12.0/24
      # EnableDns64: Boolean
      # Ipv6CidrBlock: String
      # Ipv6Native: Boolean
      MapPublicIpOnLaunch: false
      # OutpostArn: String
      # PrivateDnsNameOptionsOnLaunch: 
      #   PrivateDnsNameOptionsOnLaunch
      Tags:
        - Key: Name
          Value: Project Private Subnet (AZ2)
      VpcId: !Ref VPC

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    # DependsOn:
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Project Public Routes

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    # DependsOn:
    Properties: 
      # CarrierGatewayId: String
      DestinationCidrBlock: 0.0.0.0/0
      # DestinationIpv6CidrBlock: String
      # EgressOnlyInternetGatewayId: String
      GatewayId: !Ref InternetGateway
      # InstanceId: String
      # LocalGatewayId: String
      # NatGatewayId: String
      # NetworkInterfaceId: String
      RouteTableId: !Ref PublicRouteTable
      # TransitGatewayId: String
      # VpcEndpointId: String
      # VpcPeeringConnectionId: String

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    # DependsOn:
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    # DependsOn:
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    # DependsOn:
    Properties:
      GroupDescription: Enable HTTP from 0.0.0.0/0
      SecurityGroupEgress: 
        - CidrIp: "0.0.0.0/0"
          IpProtocol: "-1"
        - CidrIpv6: "::/0"
          IpProtocol: "-1"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '80'
          ToPort: '80'
          CidrIp: 0.0.0.0/0
        - CidrIpv6: "::/0"
          FromPort: 80
          IpProtocol: "tcp"
          ToPort: 80
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - CidrIpv6: "::/0"
          FromPort: 22
          IpProtocol: "tcp"
          ToPort: 22
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - CidrIpv6: "::/0"
          FromPort: 443
          IpProtocol: "tcp"
          ToPort: 443
        - CidrIp: "0.0.0.0/0"
          FromPort: 6379
          IpProtocol: "tcp"
          ToPort: 6379
        - CidrIpv6: "::/0"
          FromPort: 6379
          IpProtocol: "tcp"
          ToPort: 6379
        - CidrIp: "0.0.0.0/0"
          FromPort: 3301
          IpProtocol: "tcp"
          ToPort: 3301
        - CidrIpv6: "::/0"
          FromPort: 3301
          IpProtocol: "tcp"
          ToPort: 3301
        - CidrIp: "0.0.0.0/0"
          FromPort: 5432
          IpProtocol: "tcp"
          ToPort: 5432
        - CidrIpv6: "::/0"
          FromPort: 5432
          IpProtocol: "tcp"
          ToPort: 5432
        - IpProtocol: tcp
          FromPort: 9090
          ToPort: 9090
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3050
          ToPort: 3050
          CidrIp: 0.0.0.0/0
      VpcId: !Ref VPC

  MySecurityGroupNodeExporterIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MySecurityGroup
      IpProtocol: tcp
      FromPort: 9100
      ToPort: 9100
      SourceSecurityGroupId: !Ref MySecurityGroup

  MySecurityGroupDB:
    Type: AWS::EC2::SecurityGroup
    # DependsOn:
    Properties:
      GroupDescription: DB Security Group
      SecurityGroupEgress: 
        - CidrIp: "0.0.0.0/0"
          IpProtocol: "-1"
        - CidrIpv6: "::/0"
          IpProtocol: "-1"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - CidrIpv6: "::/0"
          FromPort: 22
          IpProtocol: "tcp"
          ToPort: 22
        - CidrIp: "0.0.0.0/0"
          FromPort: 3301
          IpProtocol: "tcp"
          ToPort: 3301
        - CidrIpv6: "::/0"
          FromPort: 3301
          IpProtocol: "tcp"
          ToPort: 3301
        - CidrIp: "0.0.0.0/0"
          FromPort: 443
          IpProtocol: "tcp"
          ToPort: 443
        - CidrIpv6: "::/0"
          FromPort: 443
          IpProtocol: "tcp"
          ToPort: 443
        - CidrIp: "0.0.0.0/0"
          FromPort: 5432
          IpProtocol: "tcp"
          ToPort: 5432
        - CidrIpv6: "::/0"
          FromPort: 5432
          IpProtocol: "tcp"
          ToPort: 5432
      VpcId: !Ref VPC

  MySecurityGroupNodeExporterIngressDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MySecurityGroupDB
      IpProtocol: tcp
      FromPort: 9100
      ToPort: 9100
      SourceSecurityGroupId: !Ref MySecurityGroup

  EC2InstancePostgres:
    Type: AWS::EC2::Instance
    # DependsOn: EC2InstanceDB
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            VolumeSize: 20
            VolumeType: gp3
      IamInstanceProfile: !Ref EC2InstanceProfile
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", AMI]
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref MySecurityGroupDB
        - !Ref MySecurityGroup
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: nurebo-postgres
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install -y wget ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget -q -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-18 postgresql-contrib-18

          # -------------------------------
          # Configurazione accesso remoto
          # -------------------------------
          PG_CONF_DIR="/etc/postgresql/18/main"

          sudo sed -i "s/^#\?listen_addresses.*/listen_addresses = '*'/" \
            "${!PG_CONF_DIR}/postgresql.conf"
          sudo sed -i "s/^#\?port.*/port = 5432/" \
            "${!PG_CONF_DIR}/postgresql.conf"

          echo "host    all             all             0.0.0.0/0               scram-sha-256" \
            | sudo tee -a "${!PG_CONF_DIR}/pg_hba.conf"
          echo "host    all             all             ::/0                    scram-sha-256" \
            | sudo tee -a "${!PG_CONF_DIR}/pg_hba.conf"

          sudo systemctl restart postgresql

          # -------------------------------
          # Utente admin + database
          # -------------------------------
          sudo -u postgres psql <<SQL
          ALTER USER postgres WITH PASSWORD 'Postgres1407!';
          CREATE USER admin WITH PASSWORD 'Postgres1407!' SUPERUSER;
          CREATE DATABASE nurebo OWNER admin;
          GRANT ALL PRIVILEGES ON DATABASE nurebo TO admin;
          SQL

          echo "PostgreSQL pronto su porta 5432" | sudo tee /home/ubuntu/postgres_info.txt

          # --- Node Exporter ---
          cd /tmp
          wget https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-amd64.tar.gz
          tar xvf node_exporter-1.12.1.linux-amd64.tar.gz
          sudo cp node_exporter-1.12.1.linux-amd64/node_exporter /usr/local/bin/
          sudo useradd --no-create-home --shell /bin/false node_exporter || true
          sudo chown node_exporter:node_exporter /usr/local/bin/node_exporter

          sudo tee /etc/systemd/system/node_exporter.service <<'EOF'
          [Unit]
          Description=Node Exporter
          After=network-online.target

          [Service]
          User=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable node_exporter
          sudo systemctl start node_exporter

  EC2InstancePrometheus:
    Type: AWS::EC2::Instance
    # DependsOn: EC2InstanceDB
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            VolumeSize: 20
            VolumeType: gp3
      IamInstanceProfile: !Ref EC2InstanceProfile
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", AMI]
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref MySecurityGroup
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: nurebo-prometheus
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install -y wget tar

          # Crea utente e directory per Prometheus
          sudo useradd --no-create-home --shell /bin/false prometheus
          sudo mkdir -p /etc/prometheus /var/lib/prometheus

          # Scarica e installa Prometheus
          cd /tmp
          wget https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz
          tar xvf prometheus-3.15.0.linux-amd64.tar.gz
          cd prometheus-3.15.0.linux-amd64
          sudo cp prometheus /usr/local/bin/
          sudo cp promtool /usr/local/bin/
          sudo cp -r consoles /etc/prometheus
          sudo cp -r console_libraries /etc/prometheus
          sudo chown -R prometheus:prometheus /etc/prometheus /var/lib/prometheus

          # Crea il file di configurazione prometheus.yml
          sudo tee /etc/prometheus/prometheus.yml <<'EOF'
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'node_exporter'
              ec2_sd_configs:
                - region: ${AWS::Region}
                  port: 9100
              relabel_configs:
                - source_labels: [__meta_ec2_tag_Name]
                  target_label: instance
          EOF

          # Crea il servizio systemd per Prometheus
          sudo tee /etc/systemd/system/prometheus.service <<'EOF'
          [Unit]
          Description=Prometheus Monitoring
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus/ \
            --web.console.templates=/etc/prometheus/consoles \
            --web.console.libraries=/etc/prometheus/console_libraries

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable prometheus
          sudo systemctl start prometheus

          # --- Node Exporter ---
          cd /tmp
          wget https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-amd64.tar.gz
          tar xvf node_exporter-1.12.1.linux-amd64.tar.gz
          sudo cp node_exporter-1.12.1.linux-amd64/node_exporter /usr/local/bin/
          sudo useradd --no-create-home --shell /bin/false node_exporter || true
          sudo chown node_exporter:node_exporter /usr/local/bin/node_exporter

          sudo tee /etc/systemd/system/node_exporter.service <<'EOF'
          [Unit]
          Description=Node Exporter
          After=network-online.target

          [Service]
          User=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable node_exporter
          sudo systemctl start node_exporter

  EC2InstanceGrafana:
    Type: AWS::EC2::Instance
    DependsOn: EC2InstancePrometheus
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            VolumeSize: 20
            VolumeType: gp3
      IamInstanceProfile: !Ref EC2InstanceProfile
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", AMI]
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref MySecurityGroup
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: nurebo-grafana
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install -y apt-transport-https software-properties-common wget

          # --- Grafana ---
          sudo mkdir -p /etc/apt/keyrings/
          wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/grafana.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" | sudo tee /etc/apt/sources.list.d/grafana.list

          sudo apt-get update -y
          sudo apt-get install -y grafana

          # --- Cambio porta Grafana da 3000 a 3050 ---
          sudo sed -i 's/^;\?http_port = 3000/http_port = 3050/' /etc/grafana/grafana.ini

          # Datasource Prometheus (IP privato dell'istanza Prometheus)
          sudo mkdir -p /etc/grafana/provisioning/datasources
          sudo tee /etc/grafana/provisioning/datasources/prometheus.yml <<EOF
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              # url: http://${EC2InstancePrometheus}:9090
              url: http://${EC2InstancePrometheus.PrivateIp}:9090
              isDefault: true
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable grafana-server
          sudo systemctl start grafana-server

          # --- Node Exporter (per monitorare anche Grafana) ---
          cd /tmp
          wget https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-amd64.tar.gz
          tar xvf node_exporter-1.12.1.linux-amd64.tar.gz
          sudo cp node_exporter-1.12.1.linux-amd64/node_exporter /usr/local/bin/
          sudo useradd --no-create-home --shell /bin/false node_exporter || true
          sudo chown node_exporter:node_exporter /usr/local/bin/node_exporter

          sudo tee /etc/systemd/system/node_exporter.service <<'EOF'
          [Unit]
          Description=Node Exporter
          After=network-online.target

          [Service]
          User=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable node_exporter
          sudo systemctl start node_exporter
          
