  ALBListenerNoSslCertificate:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    # DependsOn:
    Properties:
      # AlpnPolicy: 
      #   - String
      DefaultActions:
        - RedirectConfig:
            Host: '#{host}'
            Path: '/#{path}'
            Port: '443'
            Protocol: HTTPS
            StatusCode: HTTP_301
          Type: redirect 
      LoadBalancerArn: !Ref MyLoadBalancer
      Port: 80
      Protocol: HTTP 
      # SslPolicy: String

