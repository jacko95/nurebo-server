  ALBListenerSslCertificate:
    Type: AWS::ElasticLoadBalancingV2::Listener
    # DependsOn:
    Properties: 
      # AlpnPolicy: 
      #   - String
      Certificates:
        # - CertificateArn: !Ref AcmCertificate
        - CertificateArn: arn:aws:acm:eu-central-1:161741908860:certificate/35c39238-109e-4ac6-b7de-56e4aa799996
        # - CertificateArn: arn:aws:acm:eu-south-1:161741908860:certificate/40509128-2435-4e6c-85f2-c29174ff34b6
      DefaultActions:
        - Type: forward 
          TargetGroupArn: !Ref MyTargetGroup
          # TargetGroupStickinessConfig:
          #   Enabled: true
          #   DurationSeconds: 86400  # Durata massima di 7 giorni
      LoadBalancerArn: !Ref MyLoadBalancer
      Port: 443
      Protocol: HTTPS
      # SslPolicy: String

  ALBListenerRuleRedirect:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListenerSslCertificate
      Priority: 1 # Assicurati che questa regola venga eseguita prima delle altre
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - "nurebo.com" # Cattura le richieste senza "www"
      Actions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Host: "www.nurebo.com"
            Port: "443"
            StatusCode: HTTP_301

