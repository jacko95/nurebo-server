          #!/bin/bash

          set -x
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          # apt-get upgrade -y
          apt-get install -y mysql-server awscli

          tee /etc/mysql/mysql.conf.d/mysqld.cnf > /dev/null <<'EOF'
