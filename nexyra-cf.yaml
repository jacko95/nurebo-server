                    #       '"$host" "$uri" "$args" '
                    #       '"$server_protocol" "$ssl_protocol" '
                    #       '"$ssl_cipher" "$request_id" '
                    #       '$connection $connection_requests '
                    #       '$scheme $upstream_header_time '
                    #       '$upstream_connect_time ';     
                    log_format main '[$time_local] "$request_id" '
                          '"$http_x_forwarded_proto://$host" "$request" $status '
                          '"$http_x_forwarded_for" '
                          '"$http_user_agent" '
                          '$request_length $body_bytes_sent ';
                    access_log /var/log/nginx/access.log main;
                    error_log /var/log/nginx/error.log;

                    ##
                    # Gzip Settings
                    ##

                    gzip on;

                    # gzip_vary on;
                    # gzip_proxied any;
                    # gzip_comp_level 6;
                    # gzip_buffers 16 8k;
                    # gzip_http_version 1.1;
                    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

                    ##
                    # Virtual Host Configs
                    ##

                    include /etc/nginx/conf.d/*.conf;
                    include /etc/nginx/sites-enabled/*;
            }


            #mail {
            #       # See sample authentication script at:
            #       # http://wiki.nginx.org/ImapAuthenticateWithApachePhpScript
            #
            #       # auth_http localhost/auth.php;
            #       # pop3_capabilities "TOP" "USER";
            #       # imap_capabilities "IMAP4rev1" "UIDPLUS";
            #
            #       server {
            #               listen     localhost:110;
            #               protocol   pop3;
            #               proxy      on;
            #       }
            #
            #       server {
            #               listen     localhost:143;
            #               protocol   imap;
            #               proxy      on;
            #       }
            #}
            EOF

            sudo systemctl reload nginx
            # sudo nginx -s reload
            # sudo systemctl restart nginx


            sudo apt-get install -y redis-server

            sudo npm i pm2 -g

            # sudo apt install ruby-full -y
            cd /home/ubuntu
            wget https://aws-codedeploy-eu-central-1.s3.eu-central-1.amazonaws.com/latestv2/install
            chmod +x ./install
            sudo ./install auto > /tmp/logfile
            
            sudo apt-get install expect -y

            cd /home/ubuntu
            wget https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
            sudo dpkg -i -E ./amazon-cloudwatch-agent.deb
            cat << EOF > /home/ubuntu/amazon-cloudwatch-agent.json
            {
              "agent": {
                "metrics_collection_interval": 60,
                "run_as_user": "root"
              },
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {
                        "file_path": "/var/log/nginx/access.log",
                        "log_group_name": "nurebo-ec2-nginx-access-log",
                        "log_stream_name": "{instance_id}"
                      },
                      {
                        "file_path": "/var/log/nginx/error.log",
                        "log_group_name": "nurebo-ec2-nginx-error-log",
                        "log_stream_name": "{instance_id}"
                      }
                    ]
                  }
                }
              }
            }
            EOF

            sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/home/ubuntu/amazon-cloudwatch-agent.json -s

            # sudo chmod +x amazon-cloudwatch-agent-config-wizard.sh
            # sudo bash amazon-cloudwatch-agent-config-wizard.sh > amazon-cloudwatch-agent-config-wizard.txt

            # sudo apt-get update -y
            sudo apt-get install collectd -y
            # sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json -s
            # sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a status

            # --- Node Exporter ---
            cd /tmp
            wget https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-amd64.tar.gz
            tar xvf node_exporter-1.12.1.linux-amd64.tar.gz
            sudo cp node_exporter-1.12.1.linux-amd64/node_exporter /usr/local/bin/
            sudo useradd --no-create-home --shell /bin/false node_exporter || true
            sudo chown node_exporter:node_exporter /usr/local/bin/node_exporter

            sudo tee /etc/systemd/system/node_exporter.service <<'EOF'
            [Unit]
            Description=Node Exporter
            After=network-online.target

            [Service]
            User=node_exporter
            Type=simple
            ExecStart=/usr/local/bin/node_exporter

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable node_exporter
            sudo systemctl start node_exporter

