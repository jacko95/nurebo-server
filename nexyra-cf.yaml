  CodeDeployServiceRole:
    Type: "AWS::IAM::Role"
    # DependsOn:
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "codedeploy.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Path: "/"
      Policies:
        - PolicyName: "CodeDeployServiceRolePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - autoscaling:*
                  - codedeploy:*
                  - ec2:*
                  - elasticloadbalancing:*
                  - s3:*
                  - cloudwatch:*
                  - logs:*
                  - sts:*
                  # - s3:List*
                  # - s3:CreateBucket
                  # - s3:PutObject
                  # - s3:PutObjectAcl
                Resource: "*"
              - Effect: "Allow"
                Action:
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                  - "s3:PutObject"
                  - "s3:ListBucket"
                Resource: "arn:aws:s3:::nurebo-s3/*"

  CodePipelineServiceRole:
    Type: "AWS::IAM::Role"
    # DependsOn:
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "codepipeline.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Path: "/"
      Policies:
        - PolicyName: "CodePipelineServiceRolePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "s3:*"
                  - "codecommit:*"
                  - "codedeploy:*"
                  - "codepipeline:*"
                  - "cloudformation:*"
                  - "iam:PassRole"
                Resource: "*"

