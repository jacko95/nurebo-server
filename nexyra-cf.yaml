          systemctl restart mysql
          mysqladmin --wait=120 ping

          mysql <<SQL
          ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY 'k01_JmW5#-K3mSl2QP8#SiAfE9?^l';
          CREATE USER IF NOT EXISTS 'admin'@'%' IDENTIFIED WITH caching_sha2_password BY 'k01_JmW5#-K3mSl2QP8#SiAfE9?^l';
          GRANT ALL PRIVILEGES ON *.* TO 'admin'@'%' WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS 'replica_user'@'%' IDENTIFIED WITH caching_sha2_password BY 'password_replica';
          GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'replica_user'@'%';
          CREATE DATABASE IF NOT EXISTS nurebo;
          GRANT ALL PRIVILEGES ON nurebo.* TO 'admin'@'%';
          FLUSH PRIVILEGES;
          SQL

