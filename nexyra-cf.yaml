          mysql <<SQL
          ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY 'k01_JmW5#-K3mSl2QP8#SiAfE9?^l';
          CREATE USER IF NOT EXISTS 'admin'@'%' IDENTIFIED WITH caching_sha2_password BY 'k01_JmW5#-K3mSl2QP8#SiAfE9?^l';
          GRANT ALL PRIVILEGES ON *.* TO 'admin'@'%' WITH GRANT OPTION;
          FLUSH PRIVILEGES;

          CHANGE REPLICATION SOURCE TO
            SOURCE_HOST='${EC2InstanceDB.PublicDnsName}',
            SOURCE_PORT=3301,
            SOURCE_USER='replica_user',
            SOURCE_PASSWORD='password_replica',
            SOURCE_AUTO_POSITION=1,
            GET_SOURCE_PUBLIC_KEY=1;
          START REPLICA;
          SQL

          # --- Node Exporter ---
          cd /tmp
          wget https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-amd64.tar.gz
          tar xvf node_exporter-1.12.1.linux-amd64.tar.gz
          sudo cp node_exporter-1.12.1.linux-amd64/node_exporter /usr/local/bin/
          sudo useradd --no-create-home --shell /bin/false node_exporter || true
          sudo chown node_exporter:node_exporter /usr/local/bin/node_exporter

          sudo tee /etc/systemd/system/node_exporter.service <<'EOF'
          [Unit]
          Description=Node Exporter
          After=network-online.target

          [Service]
          User=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable node_exporter
          sudo systemctl start node_exporter
