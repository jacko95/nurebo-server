version: 0.0
os: linux
files:
  - source: /src/nurebo-api
    destination: /home/ubuntu/nurebo-api
  - source: /src/nurebo-app
    destination: /home/ubuntu/nurebo-app
hooks:
  BeforeInstall:
    - location: scripts/install_dependencies
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server
      timeout: 300
      runas: root
  ApplicationStop:
    - location: scripts/stop_server
      timeout: 300
      runas: root

